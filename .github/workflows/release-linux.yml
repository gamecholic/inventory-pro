# Manual Linux release: Actions tab → Release Linux → Run workflow.
# Builds the current package.json version (run it from master after the Windows
# Release workflow has pushed the tag) and attaches the AppImage, .deb and
# latest-linux.yml to that existing GitHub Release, so Ubuntu/Mint users get the
# same version as Windows. It does not bump the version or push a tag.
name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version and check the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git rev-parse --verify --quiet "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version does not exist. Cut the release with the Release workflow first."
            exit 1
          fi
          if ! gh release view "v$version" > /dev/null; then
            echo "::error::GitHub Release v$version does not exist yet. Run the Release workflow first."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "v$version^{commit}")" ]; then
            echo "::warning::HEAD differs from tag v$version; the Linux build includes commits not in that release."
          fi
      - uses: actions/setup-node@v4
        with:
          # Node 20 + better-sqlite3 + vitest workers crash on Windows;
          # keep in sync with release.yml.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run dist:linux
      - name: Attach Linux assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.release.outputs.version }}" \
            dist/*.AppImage \
            dist/*.deb \
            dist/latest-linux.yml \
            --clobber
